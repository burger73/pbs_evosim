# CI: bei jedem Push und Pull Request typprüfen, testen, bauen; Szenario-Tests (Gesamtverhalten) parallel.
# CD: Stand auf main wird als GitHub Pages veröffentlicht (burger73.github.io/pbs_evosim/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  szenarien:
    # Gesamtverhalten über mehrere Seeds (~3 Min.). Läuft parallel, blockiert das Veröffentlichen nicht –
    # ein Fehlschlag zeigt aber, dass die Balance der Simulation gekippt ist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Szenario-Tests
        run: npm run test:szenarien

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
